# PostNord — shot list. Spec: docs/SHOT_SPEC.md. Narration: script.md.
# Capture files (capture/) are the shot list for the Playwright flows + the few manual recordings.
# Demo store: Sweden origin (SEK), production PH MultiCarrier Shipping Label app, PostNord connected.
scenes:
  - { id: hook, type: hook }
  - { id: intro, type: title, shopify_logo: true }

  # ── 01 Install the app (generic app screens, same for every carrier) ──
  - id: install
    chapter: 1
    type: screen
    source: 01_app_installation.mov
    shopify_logo: true
  - id: address-menu
    chapter: 1
    type: screen
    source: 02_address_app_main_menu.png
    highlights: [{ target: menu.address_shop_location }]
  - id: address-form
    chapter: 1
    type: screen
    source: 03_address.png
    blur: [form.email?, form.phone?]
    hold: 1.2
  - id: address-add
    chapter: 1
    type: screen
    source: 04_add_address_app_main_menu.png
    zoom: menu.address
    highlights: [{ target: menu.address_plus }]

  # ── 02 Connect your PostNord account (all in-app, no carrier portal) ──
  - id: carriers-tab
    chapter: 2
    type: screen
    source: 05_carriers_menu.png
    highlights: [{ target: menu.carriers }]
  - id: postnord-connect
    chapter: 2
    type: screen
    source: 06_postnord_account_form.mov
    zoom:
      - { target: postnord.party_id_fields, on: "Party ID type" }
      - { target: postnord.production_toggle, on: "switch on production mode" }
    highlights:
      - { target: postnord.party_id_fields, on: "Party ID type", until: "choose your country" }
      - { target: postnord.production_toggle, on: "switch on production mode" }
    blur: [postnord.party_id, postnord.account_number?, postnord.bank_details?]

  # ── 03 Set up live PostNord rates ──────────────────────────────────────
  - id: packaging-menu
    chapter: 3
    type: screen
    source: 07_packaging_app_main_menu.png
    highlights: [{ target: menu.shipping_packaging }]
  - id: packaging-options
    chapter: 3
    type: screen
    source: 08_packing_method_dropdown.png
    highlights: [{ target: packaging.method_with_dropdown }]
  - id: product-dimensions
    chapter: 3
    type: screen
    source: 09_product_weight_dimensions.png
    zoom: product.weight_dimensions
    highlights: [{ target: product.weight_dimensions }]
  - id: services-split
    chapter: 3
    type: split
    left:  { source: 10_rate_automation_postnord_services.png,  caption: "PostNord Checkout rates", zoom: services.dropdown, highlights: [{ target: services.dropdown }] }
    right: { source: 10_label_automation_postnord_services.png, caption: "PostNord Label printing", zoom: services.dropdown, highlights: [{ target: services.dropdown }] }
  - { id: servicepoint-card, chapter: 3, type: statement, text: "Delivering to a service point?" }
  - id: service-point-checkout
    chapter: 3
    type: screen
    source: 11_checkout_service_point.mov
    shopify_logo: true
    highlights:
      - { target: checkout.postnord_rates, on: "live PostNord rates", until: "choose the service point" }
      - { target: checkout.service_point_picker, on: "choose the service point" }
    blur: [checkout.email, checkout.phone, checkout.card?]
  - id: service-point-default
    chapter: 3
    type: screen
    source: 12_automation_default_service_point.png
    zoom: automation.action_row
    highlights: [{ target: automation.default_service_point_action, on: "automation rule" }]

  # ── 04 Print PostNord shipping labels ─────────────────────────────────
  - id: labels-intro
    chapter: 4
    type: screen
    source: 13_single_label_generation.mov
    highlights:
      - { target: order.shipping_address, on: "address", until: "click Generate Label" }
      - { target: order.packaging_summary, on: "package", until: "click Generate Label" }
      - { target: order.service_selected, on: "selected service", until: "click Generate Label" }
  - { id: addons-card, chapter: 4, type: statement, text: "Need extra services?" }
  - id: addons-dialog
    chapter: 4
    type: screen
    source: 14_postnord_additional_settings.png
    zoom: dialog.additional_services
    highlights:
      - { target: addon.insurance, on: "insurance" }
      - { target: addon.confirmation_of_delivery, on: "Confirmation of Delivery" }
  - id: rek-services
    chapter: 4
    type: screen
    source: 15_rek_fe_ua.png
    zoom: dialog.additional_services
    highlights:
      - { target: order.service_rek, on: "PostNord Rek" }
      - { target: addon.fe, on: "Faktura" }
      - { target: addon.ua, on: "Utökat ansvar" }
  - id: addons-automation
    chapter: 4
    type: screen
    source: 16_automation_add_postnord_special_services.png
    zoom: automation.action_row
    highlights: [{ target: automation.add_special_services_action, on: "Add PostNord special services" }]
  - id: bulk-labels
    chapter: 4
    type: screen
    source: 17_bulk_label_generation.mov
    video: { speed: [] }                       # fill 4x ranges after capture
  - { id: returns-card, chapter: 4, type: statement, text: "Handling returns?" }
  - id: returns
    chapter: 4
    type: screen
    source: 18_return_label.mov
    zoom: { target: settings.return_label_type, on: "return label type", until: "then generate" }
    highlights: [{ target: settings.return_label_type, on: "return label type" }]
  - { id: intl-card, chapter: 4, type: statement, text: "Shipping outside the EU?" }
  - id: cn22-cn23-settings
    chapter: 4
    type: screen
    source: 19_cn22_cn23_category_setting.png
    zoom: settings.cn22_cn23_category
    highlights: [{ target: settings.cn22_cn23_category, on: "category of your items" }]
  - id: cn23-details
    chapter: 4
    type: screen
    source: 20_cn23_document_details.png
    zoom: dialog.cn23_details
    highlights:
      - { target: dialog.cn23_details_checkbox, on: "add CN23 details" }
      - { target: dialog.quarantine_checkbox, on: "quarantine comments" }
  - id: intl-label
    chapter: 4
    type: screen
    source: 21_international_label_cn22.mov
    highlights: [{ target: pdf.customs_declaration, on: "CN22 or CN23 is created" }]

  # ── 05 Schedule PostNord pickups (no manifest scene — PostNord has none) ──
  - { id: label-ready, chapter: 5, type: callout, kind: label_ready }
  - id: request-pickup
    chapter: 5
    type: screen
    source: 22_request_pickup.mov

  # ── 06 Fulfil & track orders ──────────────────────────────────────────
  - id: fulfil
    chapter: 6
    type: screen
    source: 23_order_fulfillment.mov
    zoom: { target: orders.status_column, on: "fulfilled" }
    highlights: [{ target: orders.status_column, on: "fulfilled" }]
  - id: tracking-sync
    chapter: 6
    type: screen
    source: 24_shopify_tracking_and_emails.mov
    shopify_logo: true
    zoom: [{ target: shopify.tracking_added }, { target: shopify.timeline, on: "emails your customers" }]
    blur: [shopify.customer_email, shopify.customer_phone, shopify.timeline_emails]
  - id: tracking-dashboard
    chapter: 6
    type: screen
    source: 25_tracking_dashboard_delivered.png
    zoom: tracking.delivered_panel
    highlights: [{ target: tracking.delivered_panel }]

  # ── Outro ─────────────────────────────────────────────────────────────
  - { id: recap, type: recap, shopify_logo: true }
  - { id: app-card, type: app_card }
  - { id: support-card, type: support_card }
