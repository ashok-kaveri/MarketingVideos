# PostNord — shot list v2 (verified scope: see brief.md). Spec: docs/SHOT_SPEC.md. Narration: script.md.
# 5 chapters. No live-rates/checkout-rates, pickup, manifest or customs-document scenes.
# Demo store: Sweden origin, production PH MultiCarrier Shipping Label app, PostNord connected.
scenes:
  - { id: hook, type: hook }
  - { id: intro, type: title, shopify_logo: true }

  # ── 01 Install the app (generic app screens) ──────────────────────────
  - id: install
    chapter: 1
    type: screen
    source: 01_app_installation.mov
    shopify_logo: true
  - id: address-menu
    chapter: 1
    type: screen
    source: 02_address_app_main_menu.png
    highlights: [{ target: menu.address_shop_location }]
  - id: address-form
    chapter: 1
    type: screen
    source: 03_address.png
    blur: [form.email?, form.phone?]
    hold: 1.2
  - id: address-add
    chapter: 1
    type: screen
    source: 04_add_address_app_main_menu.png
    zoom: menu.address
    highlights: [{ target: menu.address_plus }]

  # ── 02 Connect your PostNord account (in-app form, no carrier portal) ──
  - id: carriers-tab
    chapter: 2
    type: screen
    source: 05_carriers_menu.png
    highlights: [{ target: menu.carriers }]
  - id: postnord-connect
    chapter: 2
    type: screen
    source: 06_postnord_account_form.mov
    zoom:
      - { target: postnord.party_id_fields, on: "Party ID type" }
      - { target: postnord.production_toggle, on: "switch on production mode" }
    highlights:
      - { target: postnord.party_id_fields, on: "Party ID type", until: "choose your country" }
      - { target: postnord.production_toggle, on: "switch on production mode" }
    blur: [postnord.party_id, postnord.account_number?, postnord.bank_details?]

  # ── 03 Set up PostNord shipping ────────────────────────────────────────
  - id: packaging-menu
    chapter: 3
    type: screen
    source: 07_packaging_app_main_menu.png
    highlights: [{ target: menu.shipping_packaging }]
  - id: packaging-options
    chapter: 3
    type: screen
    source: 08_packing_method_dropdown.png
    highlights: [{ target: packaging.method_with_dropdown }]
  - id: product-dimensions
    chapter: 3
    type: screen
    source: 09_product_weight_dimensions.png
    zoom: product.weight_dimensions
    highlights: [{ target: product.weight_dimensions }]
  - id: services
    chapter: 3
    type: screen
    source: 10_label_automation_postnord_services.png   # label automation only — no checkout-rates panel
    zoom: services.dropdown
    highlights: [{ target: services.dropdown }]
  - { id: servicepoint-card, chapter: 3, type: statement, text: "Delivering to a service point?" }
  - id: service-point-enable
    chapter: 3
    type: screen
    source: 11_postnord_other_details_service_point.png
    zoom: postnord.other_details
    highlights: [{ target: postnord.service_point_toggle, on: "turn on PostNord Service Point" }]
  - id: service-point-cart-block
    chapter: 3
    type: screen
    source: 12_theme_editor_pickup_locations_block.mov
    shopify_logo: true
    highlights:
      - { target: theme.pickup_locations_block, on: "Pick-up Locations block" }
      - { target: theme.carrier_postnord, on: "select PostNord" }
  - id: service-point-buyer
    chapter: 3
    type: screen
    source: 13_cart_service_point_selection.mov
    shopify_logo: true
    highlights:
      - { target: cart.country_postal_code, on: "country and postal code", until: "pick the PostNord service point" }
      - { target: cart.service_point_list, on: "pick the PostNord service point" }
  - id: service-point-order
    chapter: 3
    type: screen
    source: 14_order_local_pickup_location_details.png
    zoom: order.local_pickup_location_details
    highlights: [{ target: order.local_pickup_location_details, on: "Local Pickup Location Details" }]
    blur: [order.customer_email?, order.customer_phone?]
  - id: service-point-default
    chapter: 3
    type: screen
    source: 15_automation_default_service_point.png
    zoom: automation.action_row
    highlights: [{ target: automation.default_service_point_action, on: "automation rule" }]

  # ── 04 Print PostNord shipping labels ─────────────────────────────────
  - id: labels-intro
    chapter: 4
    type: screen
    source: 16_single_label_generation.mov
    highlights:
      - { target: order.shipping_address, on: "address", until: "click Generate Label" }
      - { target: order.packaging_summary, on: "package", until: "click Generate Label" }
      - { target: order.service_selected, on: "selected service", until: "click Generate Label" }
  - { id: addons-card, chapter: 4, type: statement, text: "Need extra services?" }
  - id: addons-dialog
    chapter: 4
    type: screen
    source: 17_postnord_additional_settings.png
    zoom: dialog.additional_services
    highlights:
      - { target: addon.insurance, on: "insurance" }
      - { target: addon.confirmation_of_delivery, on: "Confirmation of Delivery" }
  - id: rek-services
    chapter: 4
    type: screen
    source: 18_rek_fe_ua.png
    zoom: dialog.additional_services
    highlights:
      - { target: order.service_rek, on: "PostNord Rek" }
      - { target: addon.fe, on: "Faktura" }
      - { target: addon.ua, on: "Utökat ansvar" }
  - id: addons-automation
    chapter: 4
    type: screen
    source: 19_automation_add_postnord_special_services.png
    zoom: automation.action_row
    highlights: [{ target: automation.add_special_services_action, on: "Add PostNord special services" }]
  - id: bulk-labels
    chapter: 4
    type: screen
    source: 20_bulk_label_generation.mov
    video: { speed: [] }                       # fill 4x ranges after capture
  - { id: returns-card, chapter: 4, type: statement, text: "Handling returns?" }
  - id: returns
    chapter: 4
    type: screen
    source: 21_return_label.mov
    zoom: { target: settings.return_label_type, on: "return label type", until: "then generate" }
    highlights: [{ target: settings.return_label_type, on: "return label type" }]
  - { id: intl-card, chapter: 4, type: statement, text: "Shipping outside the EU?" }
  - id: cn22-cn23-settings
    chapter: 4
    type: screen
    source: 22_cn22_cn23_category_setting.png
    zoom: settings.cn22_cn23_category
    highlights: [{ target: settings.cn22_cn23_category, on: "category of your items" }]
  - id: cn23-details
    chapter: 4
    type: screen
    source: 23_cn23_document_details.png
    zoom: dialog.cn23_details
    highlights:
      - { target: dialog.cn23_details_checkbox, on: "CN23 details" }
      - { target: dialog.quarantine_checkbox, on: "quarantine comments" }
  - id: tax-ids
    chapter: 4
    type: screen
    source: 24_tax_ids.png
    zoom: settings.tax_ids
    highlights: [{ target: settings.tax_ids, on: "tax IDs" }]
  - id: intl-label
    chapter: 4
    type: screen
    source: 25_international_label.mov

  # ── 05 Fulfil & track orders ──────────────────────────────────────────
  - id: fulfil
    chapter: 5
    type: screen
    source: 26_order_fulfillment.mov
    zoom: { target: orders.status_column, on: "fulfilled" }
    highlights: [{ target: orders.status_column, on: "fulfilled" }]
  - id: tracking-sync
    chapter: 5
    type: screen
    source: 27_shopify_tracking_and_emails.mov
    shopify_logo: true
    zoom: [{ target: shopify.tracking_added }, { target: shopify.timeline, on: "emails your customers" }]
    blur: [shopify.customer_email, shopify.customer_phone, shopify.timeline_emails]
  - id: tracking-dashboard
    chapter: 5
    type: screen
    source: 28_tracking_dashboard_delivered.png
    zoom: tracking.delivered_panel
    highlights: [{ target: tracking.delivered_panel }]

  # ── Outro ─────────────────────────────────────────────────────────────
  - { id: recap, type: recap, shopify_logo: true }
  - { id: app-card, type: app_card }
  - { id: support-card, type: support_card }
